<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <title>Flyveborde – status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="theme.css">

  <!-- MSAL: bruges til stille (ingen-popup) tjek af, om brugeren er admin / må annullere bookinger -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

  <style>
    .desk-description {
      margin: -4px 0 12px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
    }
    .category-bar {
      background: var(--nav-bg);
      padding: 16px 1rem;
    }
    .category-tabs {
      max-width: var(--maxw);
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }
    .category-tabs button {
      padding: 16px 32px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,.5);
      background: transparent;
      color: var(--text-on-dark);
      cursor: pointer;
      font-weight: 700;
      font-size: 1.4rem;
    }
    .category-tabs button.active {
      background: var(--text-on-dark);
      color: var(--nav-bg);
      border-color: transparent;
    }

    /* "Booket af"-række under slot-knapperne - kun udfyldt for det slot,
       der reelt er booket (7-16 viser fx ikke navn under 7-12/12-16). */
    .byRow {
      display: flex;
      gap: 8px;
      margin: 4px 0 0;
    }
    .byRow .byCell {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      min-height: 1.1em;
    }
    .byRow .byCell a {
      color: var(--nav-bg, #7a0d0d);
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
    .byRow .byCell a:hover { opacity: .75; }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="navbar">
    <div class="navbar-inner">
      <div class="brand">Flyveborde</div>
      <nav class="nav" id="adminNav">
        <a href="bordstatistik.html" id="statLink" style="display:none;">Bordstatistik</a>
      </nav>
    </div>
  </div>
  <div class="nav-accent"></div>

  <!-- Kategori-faner: Flyveborde / Biler / Trailere -->
  <div class="category-bar">
    <div class="category-tabs" id="categoryTabs">
      <button type="button" class="active" data-type="flyveborde">Flyveborde</button>
      <button type="button" data-type="biler">Biler</button>
      <button type="button" data-type="trailer">Trailere</button>
      <button type="button" data-type="moede">Mødelokaler</button>
    </div>
  </div>

  <!-- Accent -->
  <div class="accent-bar">Bookingstatus og hurtig booking</div>

  <main class="container">
    <section class="hero">
      <h1 id="title">Flyveborde – bookingstatus</h1>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="left">
          <label for="date">Dato:</label>
          <input id="date" type="date">
        </div>
        <button id="refresh" class="btn">↻ Opdater</button>
      </div>

      <div id="grid" class="grid"></div>
    </section>
  </main>

<script>
(() => {
  const CATEGORY_LABELS = {
    flyveborde: "Flyveborde",
    biler: "Biler",
    trailer: "Trailere",
    moede: "Mødelokaler"
  };

  let currentType = "flyveborde";

  // Sat af "booket af"-rettighedstjekket nederst i filen (async), som
  // genindlæser gitteret én gang, når svaret er klart. Indtil da vises
  // ingen navne - det er en bevidst, sikker standard (kun brugere med
  // annulleringsret skal se hvem der har booket).
  let canCancelBookings = false;
  window.__flyveborde_setCancelRights = (val) => {
    canCancelBookings = !!val;
    load();
  };

  function apiUrlFor(type, dateIso) {
    return type === "flyveborde"
      ? `/api/flyveborde?date=${encodeURIComponent(dateIso)}&t=${Date.now()}`
      : `/api/liveresources?type=${encodeURIComponent(type)}&date=${encodeURIComponent(dateIso)}&t=${Date.now()}`;
  }

  const grid = document.getElementById("grid");
  const refreshBtn = document.getElementById("refresh");
  const dateInput = document.getElementById("date");
  const titleEl = document.getElementById("title");
  const categoryTabs = document.getElementById("categoryTabs");

  const pad2 = n => String(n).padStart(2, "0");

  const todayIso = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  };

  const isoToDk = iso => {
    const [y,m,d] = String(iso).split("-");
    return `${d}-${m}-${y}`;
  };

  const rowDateIso = row => String(row.date || "").split("T")[0];

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function goBooking(deskId, slot, dateIso) {
    const url =
      `select.html?desk=${encodeURIComponent(deskId)}` +
      `&slot=${encodeURIComponent(slot)}` +
      `&date=${encodeURIComponent(dateIso)}` +
      `&type=${encodeURIComponent(currentType)}`;

    window.location.href = url;
  }

  function goCancel(deskId, slot, dateIso) {
    const url =
      `select.html?desk=${encodeURIComponent(deskId)}` +
      `&slot=${encodeURIComponent(slot)}` +
      `&date=${encodeURIComponent(dateIso)}` +
      `&type=${encodeURIComponent(currentType)}` +
      `&mode=cancel`;

    window.location.href = url;
  }

  function slotButton(label, deskId, slot, dateIso, isFree) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn " + (isFree ? "free" : "busy");
    b.textContent = label;

    if (isFree) {
      b.addEventListener("click", () => goBooking(deskId, slot, dateIso));
    } else {
      b.disabled = true;
    }

    return b;
  }

  // Én celle i "booket af"-rækken. Viser KUN et navn, hvis netop dette
  // slot er optaget OG har sit eget "by"-felt udfyldt (en 7-16-booking
  // udfylder kun DayBy, ikke AMBy/PMBy - se confirmbooking/
  // bookdeskforother). Er brugeren ikke rettighedshaver, forbliver
  // cellen altid tom, uanset om der findes et navn.
  function byCell(byName, isFree, deskId, slot, dateIso) {
    const cell = document.createElement("div");
    cell.className = "byCell";

    const name = String(byName || "").trim();
    if (isFree || !name || !canCancelBookings) return cell;

    const a = document.createElement("a");
    a.textContent = name;
    a.title = "Klik for at annullere denne booking";
    a.addEventListener("click", () => goCancel(deskId, slot, dateIso));
    cell.appendChild(a);
    return cell;
  }

  async function load() {
    try {
      const selected = dateInput.value || todayIso();
    titleEl.textContent = `${CATEGORY_LABELS[currentType]} – bookingstatus for ${isoToDk(selected)}`;
    grid.innerHTML = `<div class="panel">Henter data…</div>`;

    const res = await fetch(apiUrlFor(currentType, selected), { cache: "no-store" });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data?.details || data?.error || `API-fejl ${res.status}`);
    }

    const rows = data.filter(r => rowDateIso(r) === selected);

    grid.innerHTML = "";

    const byDesk = {};
    for (const r of rows) {
      if (r.deskId) byDesk[r.deskId] = r;
    }

    const isFlyveborde = currentType === "flyveborde";

    for (const deskId of Object.keys(byDesk).sort()) {
      const r = byDesk[deskId];

      const amFree = r.AM === false;
      const pmFree = r.PM === false;
      const dayFree = typeof r.Day === "boolean"
        ? r.Day === false
        : amFree && pmFree;

      const card = document.createElement("div");
      card.className = "panel";

      const title = document.createElement("div");
      title.className = "desk";
      title.innerHTML = `${deskId} <span class="badge">${isoToDk(selected)}</span>`;

      const description = document.createElement("div");
      description.className = "desk-description";
      description.textContent = String(r.description || "").trim();
      description.hidden = !description.textContent;

      const buttons = document.createElement("div");
      buttons.className = "buttons";
      buttons.appendChild(slotButton("7–12", deskId, "am", selected, amFree));
      buttons.appendChild(slotButton("12–16", deskId, "pm", selected, pmFree));
      buttons.appendChild(slotButton("7–16", deskId, "day", selected, dayFree));

      card.appendChild(title);
      card.appendChild(description);
      card.appendChild(buttons);

      // "Booket af"-række - kun relevant for flyveborde (Dataverse-backed
      // med by-felter). Biler/trailer/mødelokaler er live-fra-kalender og
      // har ikke disse felter.
      if (isFlyveborde) {
        const byRow = document.createElement("div");
        byRow.className = "byRow";
        byRow.appendChild(byCell(r.AMBy,  amFree,  deskId, "am",  selected));
        byRow.appendChild(byCell(r.PMBy,  pmFree,  deskId, "pm",  selected));
        byRow.appendChild(byCell(r.DayBy, dayFree, deskId, "day", selected));
        card.appendChild(byRow);
      }

      const note = document.createElement("div");
      note.className = "muted";
      note.textContent =
        `${amFree ? "7–12 ledig" : "7–12 optaget"} · ` +
        `${pmFree ? "12–16 ledig" : "12–16 optaget"} · ` +
        `${dayFree ? "Hele dagen ledig" : "Hele dagen optaget"}`;
      card.appendChild(note);

      grid.appendChild(card);
    }

      if (!grid.children.length) {
        grid.innerHTML = `<div class="panel">Ingen flyveborde denne dag</div>`;
      }
    } catch (error) {
      console.error(error);
      grid.innerHTML = `<div class="panel">Kunne ikke hente flyveborde: ${String(error.message || error)}</div>`;
    }
  }

  dateInput.value = todayIso();
  refreshBtn.addEventListener("click", load);
  dateInput.addEventListener("change", load);

  categoryTabs.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn || btn.classList.contains("active")) return;

    categoryTabs.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    load();
  });

  load();
})();
</script>

<script>
// ===== Admin-link + "annuller booking"-rettighed =====
// "Bordstatistik" vises KUN for medlemmer af Entra-gruppen "portal_admin".
// Muligheden for at klikke på et "booket af"-navn og annullere det vises
// for medlemmer af BookForOthersGroupMail ELLER "portal_admin" - samme
// rettighed som "book for en anden" i select.html. Begge tjek sker helt
// stille (ingen popup/login-prompt). Almindelige brugere ser aldrig noget
// til det - hverken linket eller selv navnet (se byCell i scriptet ovenfor).
//
// Denne side fungerer også som "opsamlingssted" når select.html har måttet
// sende brugeren til Microsoft-login via redirect (fordi en pop-up blev
// blokeret, fx i en indlejret webvisning på iPhone). Se select.html for
// hvor "flyveborde_pending_booking" bliver sat.
(async () => {
  const statLink = document.getElementById("statLink");

  if (typeof window.msal === "undefined") return; // MSAL kunne ikke indlæses – linket forbliver skjult

  const CLIENT_ID = "b0e2b0ad-f77a-474c-acae-506e8a925ae6";
  const TENANT_ID = "5fbd2064-b472-4740-b035-3cb52bb46de4";
  const PENDING_KEY = "flyveborde_pending_booking";

  const msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CLIENT_ID,
      authority: `https://login.microsoftonline.com/${TENANT_ID}`,
      redirectUri: location.origin
    },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
  });

  // Skal altid kaldes ved sideindlæsning, så MSAL kan afslutte en evt.
  // igangværende redirect-login, inden vi laver andre MSAL-kald.
  let account = null;
  try {
    const redirectResult = await msalInstance.handleRedirectPromise();
    account = redirectResult?.account || msalInstance.getAllAccounts()[0] || null;
  } catch (e) {
    console.error("MSAL redirect-fejl:", e);
  }

  // Var brugeren midt i at booke et flyvebord, da pop-up'en blev blokeret?
  // Så sender vi dem videre til select.html med samme desk/slot/dato, og
  // select.html færdiggør bookingen automatisk.
  const pendingRaw = sessionStorage.getItem(PENDING_KEY);
  if (pendingRaw) {
    sessionStorage.removeItem(PENDING_KEY);
    if (account) {
      try {
        const pending = JSON.parse(pendingRaw);
        if (pending?.desk && pending?.slot && pending?.date) {
          const url =
            `select.html?desk=${encodeURIComponent(pending.desk)}` +
            `&slot=${encodeURIComponent(pending.slot)}` +
            `&date=${encodeURIComponent(pending.date)}` +
            `&type=${encodeURIComponent(pending.type || "flyveborde")}` +
            `&mode=${encodeURIComponent(pending.mode || "book")}` +
            `&autoconfirm=1`;
          location.replace(url);
          return; // vi navigerer væk – kør ikke resten af init på denne side
        }
      } catch (e) {
        console.error("Kunne ikke genskabe pending booking:", e);
      }
    }
    // Login lykkedes ikke (fx annulleret) – bliv på forsiden, brugeren kan
    // klikke sig ind på skrivebordet igen.
  }

  async function getSilentOid() {
    try {
      let acc = account || msalInstance.getAllAccounts()[0];
      if (!acc) {
        const result = await msalInstance.ssoSilent({ scopes: ["openid", "profile"] });
        acc = result.account;
      }
      return acc?.idTokenClaims?.oid || acc?.localAccountId || null;
    } catch {
      return null; // ingen aktiv session - helt normalt, ingen fejl vises
    }
  }

  async function checkAdminAccess(oid) {
    if (!statLink || !oid) return;
    try {
      const res = await fetch(`/api/checkadmin?oid=${encodeURIComponent(oid)}`, { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      if (data?.isAdmin) statLink.style.display = "inline";
    } catch {
      // Ikke i gruppen / fejl → linket forbliver skjult. Ingen fejl vises.
    }
  }

  async function checkCancelRights(oid) {
    if (!oid) return;
    try {
      const res = await fetch(`/api/checkbookforothers?oid=${encodeURIComponent(oid)}`, { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      if (data?.allowed && typeof window.__flyveborde_setCancelRights === "function") {
        window.__flyveborde_setCancelRights(true);
      }
    } catch {
      // Ikke i gruppen / fejl → navne forbliver skjulte. Ingen fejl vises.
    }
  }

  const oid = await getSilentOid();
  await Promise.all([checkAdminAccess(oid), checkCancelRights(oid)]);
})();
</script>

</body>
</html>
