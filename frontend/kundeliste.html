<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <title>Kundeliste</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/kundeliste/app.css" />
  <style>
    #tbody tr.clickable-row {
      cursor: pointer;
    }
    /* Filterfelt under hver kolonneoverskrift */
    .dataTable thead th .colLabel { display:block; margin-bottom:6px; }
    .dataTable thead th .colFilter {
      width:100%; min-width:70px; box-sizing:border-box; height:30px;
      border:1px solid #d1d5db; border-radius:6px; padding:0 8px;
      font:inherit; font-size:13px; font-weight:400; background:#fff; cursor:text;
    }
    .dataTable thead th .colFilter:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 2px rgba(195,10,20,.12); }
    /* Kunde med produkter, hvor installationsdato er "xx" */
    .dataTable a.link.harXX { color:#b91c1c; font-weight:700; }
    @media (max-width: 640px) {
      .navExtra { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <div class="logo" aria-label="Herrup Portal"></div>
      <div>Kundeliste</div>
    </div>
    <div class="nav">
      <span id="userDisplay" class="muted" style="color:#fff;opacity:.9"></span>
      <span class="sep">|</span>
      <a class="navExtra" href="/importlog.html">Importlog</a>
      <a href="/logout">Log ud</a>
    </div>
  </div>
  <div class="nav-accent"></div>
</div>
  <main class="pageWrap">
    <section class="toolbar">
      <input id="q" type="search" placeholder="Søg kundenr, navn, område, status..." style="min-width:320px" autocomplete="off" />
      <select id="aktiv"><option value="true">Aktive</option><option value="">Alle</option><option value="false">Inaktive</option></select>
      <div id="lastImportText" class="muted small" style="white-space:nowrap; padding:0 8px;">Sidste import kørt: henter...</div>
      <div class="toolbarSpacer"></div>
      <div id="countText" class="muted small"></div>
      <button id="btnRefresh">Opdater</button>
    </section>
    <div id="status" class="status loading"><div class="spinner"></div> Henter kunder...</div>
    <section class="tableWrap">
      <table class="dataTable">
        <thead><tr>
          <th class="sortable" data-sort="kundenr"><span class="colLabel">Kundenr.</span><input class="colFilter" type="search" data-col="kundenr" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="navn"><span class="colLabel">Navn</span><input class="colFilter" type="search" data-col="navn" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="omraade"><span class="colLabel">Område</span><input class="colFilter" type="search" data-col="omraade" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="kundestatus"><span class="colLabel">Kundestatus</span><input class="colFilter" type="search" data-col="kundestatus" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="sidstImporteret"><span class="colLabel">Sidst opdateret</span><input class="colFilter" type="search" data-col="sidstImporteret" placeholder="Filtrér…" autocomplete="off"></th>
          <th style="vertical-align:bottom;"><button type="button" class="btn" id="btnClearFilters" style="display:none">Ryd filtre</button></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="/assets/kundeliste/common.js"></script>
  <script>
    let rows = [], filtered = [], sortKey = 'navn', sortDir = 1;
    const FILTER_COLS = ['kundenr', 'navn', 'omraade', 'kundestatus', 'sidstImporteret'];
    const colFilters = {}; // kolonne -> filtertekst (gemmes i URL'en som f_<kolonne>)
    restoreStateFromUrl();
    initUser();
    document.getElementById('btnRefresh').onclick = load;
    document.getElementById('q').oninput = () => { syncUrlState(); render(); };
    document.getElementById('aktiv').onchange = () => { syncUrlState(); load(); };
    document.querySelectorAll('.colFilter').forEach(inp => {
      inp.value = colFilters[inp.dataset.col] || '';
      inp.addEventListener('click', e => e.stopPropagation()); // klik i feltet må ikke sortere
      inp.addEventListener('input', () => { colFilters[inp.dataset.col] = inp.value; syncUrlState(); render(); });
    });
    document.getElementById('btnClearFilters').onclick = () => {
      FILTER_COLS.forEach(c => { delete colFilters[c]; });
      document.querySelectorAll('.colFilter').forEach(i => { i.value = ''; });
      syncUrlState(); render();
    };
    document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
      const nextKey = th.dataset.sort;
      if (sortKey === nextKey) sortDir *= -1;
      else { sortKey = nextKey; sortDir = 1; }
      syncUrlState();
      render();
    });

    function restoreStateFromUrl() {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) document.getElementById('q').value = p.get('q');
      if (p.has('aktiv')) document.getElementById('aktiv').value = p.get('aktiv');
      if (p.has('sort')) sortKey = p.get('sort');
      if (p.has('dir')) sortDir = p.get('dir') === '-1' ? -1 : 1;
      FILTER_COLS.forEach(c => { if (p.get('f_' + c)) colFilters[c] = p.get('f_' + c); });
    }

    function syncUrlState() {
      const p = new URLSearchParams();
      const q = document.getElementById('q').value;
      const aktiv = document.getElementById('aktiv').value;
      if (q) p.set('q', q);
      if (aktiv !== 'true') p.set('aktiv', aktiv);
      if (sortKey !== 'navn') p.set('sort', sortKey);
      if (sortDir !== 1) p.set('dir', String(sortDir));
      FILTER_COLS.forEach(c => { if ((colFilters[c] || '').trim()) p.set('f_' + c, colFilters[c]); });
      const qs = p.toString();
      history.replaceState(null, '', qs ? `/kundeliste.html?${qs}` : '/kundeliste.html');
    }

    async function load() {
      setStatus('loading','<div class="spinner"></div> Henter kunder...');
      await Promise.all([loadKunder(), loadLastImport()]);
      setStatus('', '');
      render();
    }

    async function loadKunder() {
      const aktiv = document.getElementById('aktiv').value;
      const r = await fetch('/api/kunder?aktiv=' + encodeURIComponent(aktiv));
      const j = await r.json();
      if (!r.ok || j.error) throwStatus('Fejl: ' + esc(j.error || r.status));
      rows = j.kunder || [];
    }

    async function loadLastImport() {
      const el = document.getElementById('lastImportText');
      try {
        const r = await fetch('/api/importlog');
        const j = await r.json();
        const latest = (j.logs || [])[0];
        const txt = latest ? `Sidste import kørt: ${fmtDateTime(latest.starttid || latest.createdon)}` : 'Sidste import kørt: ingen log';
        el.innerHTML = `<a class="link" href="/importlog.html" title="Se importlog">${esc(txt)}</a>`;
      } catch {
        el.textContent = 'Sidste import kørt: ukendt';
      }
    }

    function throwStatus(msg) { setStatus('error', msg); throw new Error(msg); }
    function setStatus(cls, html) { const el=document.getElementById('status'); el.className='status '+cls; el.innerHTML=html; el.style.display=html?'flex':'none'; }

    function sortValue(row, key) {
      if (key === 'sidstImporteret') return row.sidstImporteret || row.modifiedon || '';
      if (key === 'aktiv') return row.aktiv ? '1' : '0';
      return row[key] || '';
    }

    // Den tekst en kolonne filtreres på (samme som der vises)
    function filterText(row, col) {
      if (col === 'sidstImporteret') return fmtDateTime(row.sidstImporteret || row.modifiedon) || '';
      return String(row[col] || '');
    }

    function openKunde(kundenr) {
      location.href = `/kunde.html?kundenr=${encodeURIComponent(kundenr)}`;
    }

    function render() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const active = FILTER_COLS.filter(c => (colFilters[c] || '').trim());
      filtered = rows.filter(k =>
        (!q || [k.kundenr,k.navn,k.omraade,k.kundestatus,k.aktiv?'aktiv':'inaktiv'].join(' ').toLowerCase().includes(q)) &&
        active.every(c => filterText(k, c).toLowerCase().includes(colFilters[c].trim().toLowerCase()))
      );
      document.getElementById('btnClearFilters').style.display = active.length ? '' : 'none';
      filtered.sort((a,b)=>String(sortValue(a, sortKey)).localeCompare(String(sortValue(b, sortKey)),'da',{numeric:true})*sortDir);
      document.querySelectorAll('th.sortable').forEach(th => th.classList.toggle('sort-active', th.dataset.sort === sortKey));
      document.getElementById('countText').textContent = `${filtered.length} af ${rows.length} kunder`;
      document.getElementById('tbody').innerHTML = filtered.map(k => `<tr class="clickable-row" onclick="openKunde('${esc(k.kundenr)}')">
        <td class="small muted">${esc(k.kundenr)}</td>
        <td><a class="link${k.harXX ? ' harXX' : ''}" href="/kunde.html?kundenr=${encodeURIComponent(k.kundenr)}" onclick="event.stopPropagation()"${k.harXX ? ' title="Har produkter med xx i installationsdato (ikke aktive)"' : ''}>${esc(k.navn)}</a></td>
        <td>${esc(k.omraade)}</td>
        <td>${esc(k.kundestatus)}</td>
        <td class="small muted">${fmtDateTime(k.sidstImporteret || k.modifiedon)}</td>
        <td style="white-space:nowrap;"><a class="btn" href="/kundeinfo.html?kundenr=${encodeURIComponent(k.kundenr)}" onclick="event.stopPropagation()">Info</a> <a class="btn" href="/kunde.html?kundenr=${encodeURIComponent(k.kundenr)}" onclick="event.stopPropagation()">Åbn</a></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">Ingen kunder</td></tr>';
    }
    load().catch(e => setStatus('error', e.message));
  </script>
</body>
</html>
