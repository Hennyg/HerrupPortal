<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <title>Kundeliste</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/kundeliste/app.css" />
  <style>
    #tbody tr.clickable-row {
      cursor: pointer;
    }
    /* Filterfelt under hver kolonneoverskrift */
    .dataTable thead th .colLabel { display:block; margin-bottom:6px; }
    .dataTable thead th .colFilter {
      width:100%; min-width:70px; box-sizing:border-box; height:30px;
      border:1px solid #d1d5db; border-radius:6px; padding:0 8px;
      font:inherit; font-size:13px; font-weight:400; background:#fff; cursor:text;
    }
    .dataTable thead th .colFilter:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 2px rgba(195,10,20,.12); }
    /* Knap: kun kunder med produkter, hvor installationsdato er xx-xx-xxxx */
    #btnXX.active { background:#fdf2f2; border-color:var(--red); color:var(--red); font-weight:700; }
    /* Salmonella på mindst én af kundens adresser */
    .dataTable td.kundenrSal { background:#fee2e2; color:#991b1b !important; font-weight:700; }
    .listLegend { font-size:13px; color:#4b5563; margin:-4px 0 10px; display:flex; align-items:center; gap:6px 18px; flex-wrap:wrap; }
    .listLegend .lg { display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:6px; vertical-align:-3px; }
    .listLegend .lgSal { background:#fee2e2; border:1px solid #fca5a5; }
    /* Søgning på serienummer: link direkte til produktet */
    .snHint { display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap; background:#fdf2f2; border:1px solid #f5c2c2;
              border-radius:8px; padding:8px 12px; margin:0 0 10px; font-size:14px; }
    .snHint[hidden] { display:none; }
    .snHint a { color:var(--red); font-weight:600; }
    @media (max-width: 640px) {
      .navExtra { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <div class="logo" aria-label="Herrup Portal"></div>
      <div>Kundeliste</div>
    </div>
    <div class="nav">
      <span id="userDisplay" class="muted" style="color:#fff;opacity:.9"></span>
      <span class="sep">|</span>
      <a class="navExtra" href="/importlog.html">Importlog</a>
      <a href="/logout">Log ud</a>
    </div>
  </div>
  <div class="nav-accent"></div>
</div>
  <main class="pageWrap">
    <section class="toolbar">
      <input id="q" type="search" placeholder="Søg kundenr, navn, område, status, kontrakt – eller serienr. for at gå til produktet" style="min-width:320px" autocomplete="off" />
      <select id="aktiv"><option value="true">Aktive</option><option value="">Alle</option><option value="false">Inaktive</option></select>
      <button type="button" class="btn" id="btnXX" title="Vis kun kunder med produkter, hvor installationsdatoen er xx-xx-xxxx (fx planlagte projekter, der ikke er aktive endnu)">xx-xx-xxxx</button>
      <div id="lastImportText" class="muted small" style="white-space:nowrap; padding:0 8px;">Sidste import kørt: henter...</div>
      <div class="toolbarSpacer"></div>
      <div id="countText" class="muted small"></div>
      <button id="btnRefresh">Opdater</button>
    </section>
    <div class="snHint" id="snHint" hidden></div>
    <div class="listLegend">
      <span><span class="lg lgSal"></span>Rød baggrund på kundenr.: salmonella på mindst én af kundens adresser <span id="salStatus" class="muted"></span></span>
      <span><b>xx-xx-xxxx</b>: viser kun kunder med produkter, hvor installationsdatoen er xx-xx-xxxx</span>
    </div>
    <div id="status" class="status loading"><div class="spinner"></div> Henter kunder...</div>
    <section class="tableWrap">
      <table class="dataTable">
        <thead><tr>
          <th class="sortable" data-sort="kundenr"><span class="colLabel">Kundenr.</span><input class="colFilter" type="search" data-col="kundenr" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="navn"><span class="colLabel">Navn</span><input class="colFilter" type="search" data-col="navn" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="omraade"><span class="colLabel">Område</span><input class="colFilter" type="search" data-col="omraade" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="kundestatus"><span class="colLabel">Kundestatus</span><input class="colFilter" type="search" data-col="kundestatus" placeholder="Filtrér…" autocomplete="off"></th>
          <th class="sortable" data-sort="kontrakt"><span class="colLabel">Kontrakt</span><input class="colFilter" type="search" data-col="kontrakt" placeholder="Filtrér…" autocomplete="off"></th>
          <th style="vertical-align:bottom;"><button type="button" class="btn" id="btnClearFilters" style="display:none">Ryd filtre</button></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="/assets/kundeliste/common.js"></script>
  <script>
    let rows = [], filtered = [], sortKey = 'navn', sortDir = 1;
    let onlyXX = false;            // knappen "xx-xx-xxxx"
    let salRed = new Set();        // kundenumre med salmonella på en adresse
    const FILTER_COLS = ['kundenr', 'navn', 'omraade', 'kundestatus', 'kontrakt'];
    const colFilters = {}; // kolonne -> filtertekst (gemmes i URL'en som f_<kolonne>)
    restoreStateFromUrl();
    initUser();
    document.getElementById('btnRefresh').onclick = load;
    document.getElementById('q').oninput = () => { syncUrlState(); render(); scheduleSnJump(); };
    // Enter: findes søgningen i serienumrene hos præcis én kunde, hoppes der til produktet
    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const hits = snSearch(document.getElementById('q').value);
      if (hits.length === 1) { e.preventDefault(); jumpToSn(hits[0]); }
    });
    document.getElementById('aktiv').onchange = () => { syncUrlState(); load(); };
    document.getElementById('btnXX').onclick = () => { onlyXX = !onlyXX; syncUrlState(); render(); };
    document.querySelectorAll('.colFilter').forEach(inp => {
      inp.value = colFilters[inp.dataset.col] || '';
      inp.addEventListener('click', e => e.stopPropagation()); // klik i feltet må ikke sortere
      inp.addEventListener('input', () => { colFilters[inp.dataset.col] = inp.value; syncUrlState(); render(); });
    });
    document.getElementById('btnClearFilters').onclick = () => {
      FILTER_COLS.forEach(c => { delete colFilters[c]; });
      document.querySelectorAll('.colFilter').forEach(i => { i.value = ''; });
      syncUrlState(); render();
    };
    document.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
      const nextKey = th.dataset.sort;
      if (sortKey === nextKey) sortDir *= -1;
      else { sortKey = nextKey; sortDir = 1; }
      syncUrlState();
      render();
    });

    function restoreStateFromUrl() {
      const p = new URLSearchParams(location.search);
      if (p.has('q')) document.getElementById('q').value = p.get('q');
      if (p.has('aktiv')) document.getElementById('aktiv').value = p.get('aktiv');
      if (p.has('sort')) sortKey = p.get('sort');
      if (p.has('dir')) sortDir = p.get('dir') === '-1' ? -1 : 1;
      onlyXX = p.get('xx') === '1';
      FILTER_COLS.forEach(c => { if (p.get('f_' + c)) colFilters[c] = p.get('f_' + c); });
    }

    function syncUrlState() {
      const p = new URLSearchParams();
      const q = document.getElementById('q').value;
      const aktiv = document.getElementById('aktiv').value;
      if (q) p.set('q', q);
      if (aktiv !== 'true') p.set('aktiv', aktiv);
      if (sortKey !== 'navn') p.set('sort', sortKey);
      if (sortDir !== 1) p.set('dir', String(sortDir));
      if (onlyXX) p.set('xx', '1');
      FILTER_COLS.forEach(c => { if ((colFilters[c] || '').trim()) p.set('f_' + c, colFilters[c]); });
      const qs = p.toString();
      history.replaceState(null, '', qs ? `/kundeliste.html?${qs}` : '/kundeliste.html');
    }

    async function load() {
      setStatus('loading','<div class="spinner"></div> Henter kunder...');
      await Promise.all([loadKunder(), loadLastImport()]);
      setStatus('', '');
      render();
      loadSalmonellaMarks();   // farver kundenumre, når den er klar (venter ikke)
    }

    // Kunder med salmonella på mindst én adresse (samme regel som den røde
    // ramme på kunde.html). Beregnes på serveren og huskes der i 15 min.
    async function loadSalmonellaMarks() {
      const st = document.getElementById('salStatus');
      st.textContent = '(henter…)';
      try {
        const r = await fetch('/api/kunder-salmonella');
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || r.status);
        salRed = new Set(j.red || []);
        st.textContent = '';
        render();
      } catch (e) {
        console.warn('Salmonella-markering:', e);
        st.textContent = '(kunne ikke hentes)';
      }
    }

    async function loadKunder() {
      const aktiv = document.getElementById('aktiv').value;
      const r = await fetch('/api/kunder?aktiv=' + encodeURIComponent(aktiv));
      const j = await r.json();
      if (!r.ok || j.error) throwStatus('Fejl: ' + esc(j.error || r.status));
      rows = j.kunder || [];
    }

    async function loadLastImport() {
      const el = document.getElementById('lastImportText');
      try {
        const r = await fetch('/api/importlog');
        const j = await r.json();
        const latest = (j.logs || [])[0];
        const txt = latest ? `Sidste import kørt: ${fmtDateTime(latest.starttid || latest.createdon)}` : 'Sidste import kørt: ingen log';
        el.innerHTML = `<a class="link" href="/importlog.html" title="Se importlog">${esc(txt)}</a>`;
      } catch {
        el.textContent = 'Sidste import kørt: ukendt';
      }
    }

    function throwStatus(msg) { setStatus('error', msg); throw new Error(msg); }
    function setStatus(cls, html) { const el=document.getElementById('status'); el.className='status '+cls; el.innerHTML=html; el.style.display=html?'flex':'none'; }

    function sortValue(row, key) {
      if (key === 'aktiv') return row.aktiv ? '1' : '0';
      return row[key] || '';
    }

    // Den tekst en kolonne filtreres på (samme som der vises)
    function filterText(row, col) {
      return String(row[col] || '');
    }

    // Tooltip: antal produkter pr. kontrakttype
    function kontraktTitle(k) {
      return Object.entries(k.kontraktAntal || {})
        .sort((a, b) => b[1] - a[1])
        .map(([n, c]) => `${n}: ${c} produkt${c === 1 ? '' : 'er'}`)
        .join('\n');
    }

    function kundeUrl(kundenr, sn) {
      return `/kunde.html?kundenr=${encodeURIComponent(kundenr)}${sn ? `&sn=${encodeURIComponent(sn)}` : ''}`;
    }
    function openKunde(kundenr) {
      location.href = kundeUrl(kundenr);
    }
    // Kundesiden med produktlisten åben med det samme
    function produktUrl(kundenr) {
      return `/kunde.html?kundenr=${encodeURIComponent(kundenr)}&vis=produkter`;
    }

    // ── Søgning på serienummer ──────────────────────────────────────────────
    // Serienumre filtrerer IKKE kundelisten. I stedet:
    //  - søgningen er præcis et serienummer (fx indsat/scannet) → hop direkte
    //    til produktlisten på kunde.html med kun det produkt (sn=...)
    //  - Enter, og søgningen findes i serienumre hos præcis én kunde → hop
    //  - ellers vises de fundne serienumre som links over listen
    // Returnerer [{ k, sn, exact, count }], ét pr. kunde
    function snSearch(raw) {
      const q = String(raw || '').trim().toLowerCase();
      if (q.length < 3) return [];
      const hits = [];
      for (const k of rows) {
        const all = (k.serier || []).filter(s => String(s).toLowerCase().includes(q));
        if (!all.length) continue;
        const exact = all.find(s => String(s).toLowerCase() === q);
        hits.push({ k, sn: exact || all[0], exact: !!exact, count: all.length });
      }
      return hits;
    }

    function jumpToSn(hit) {
      if (!hit) return;
      // Ryd søgningen i URL'en, så "Tilbage" viser hele kundelisten
      document.getElementById('q').value = '';
      syncUrlState();
      location.href = kundeUrl(hit.k.kundenr, hit.sn);
    }

    let snJumpTimer = null;
    function scheduleSnJump() {
      clearTimeout(snJumpTimer);
      snJumpTimer = setTimeout(() => {
        const exact = snSearch(document.getElementById('q').value).filter(h => h.exact);
        if (exact.length === 1) jumpToSn(exact[0]);
      }, 500);
    }

    let snHits = [];
    function renderSnHint() {
      const el = document.getElementById('snHint');
      snHits = snSearch(document.getElementById('q').value);
      if (!snHits.length) { el.hidden = true; el.innerHTML = ''; return; }
      const shown = snHits.slice(0, 8);
      el.hidden = false;
      el.innerHTML = `<span>Serienr. fundet hos:</span>${shown.map((h, i) =>
        `<a href="${esc(kundeUrl(h.k.kundenr, h.sn))}" onclick="event.preventDefault(); jumpToSn(snHits[${i}])">${esc(h.k.navn)} <span class="muted">(SN ${esc(h.sn)}${h.count > 1 ? ` +${h.count - 1}` : ''})</span></a>`
      ).join('')}${snHits.length > shown.length ? `<span class="muted">+${snHits.length - shown.length} flere – skriv mere</span>` : ''}${snHits.length === 1 ? '<span class="muted">Tryk Enter for at åbne</span>' : ''}`;
    }

    function render() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const active = FILTER_COLS.filter(c => (colFilters[c] || '').trim());
      filtered = rows.filter(k =>
        (!q || [k.kundenr,k.navn,k.omraade,k.kundestatus,k.kontrakt,k.aktiv?'aktiv':'inaktiv'].join(' ').toLowerCase().includes(q)) &&
        active.every(c => filterText(k, c).toLowerCase().includes(colFilters[c].trim().toLowerCase())) &&
        (!onlyXX || k.harXX)
      );
      document.getElementById('btnXX').classList.toggle('active', onlyXX);
      document.getElementById('btnClearFilters').style.display = active.length ? '' : 'none';
      filtered.sort((a,b)=>String(sortValue(a, sortKey)).localeCompare(String(sortValue(b, sortKey)),'da',{numeric:true})*sortDir);
      document.querySelectorAll('th.sortable').forEach(th => th.classList.toggle('sort-active', th.dataset.sort === sortKey));
      document.getElementById('countText').textContent = `${filtered.length} af ${rows.length} kunder`;
      renderSnHint();
      document.getElementById('tbody').innerHTML = filtered.map(k => {
        return `<tr class="clickable-row" onclick="openKunde('${esc(k.kundenr)}')">
        <td class="small muted${salRed.has(String(k.kundenr)) ? ' kundenrSal' : ''}"${salRed.has(String(k.kundenr)) ? ' title="Salmonella på mindst én af kundens adresser"' : ''}>${esc(k.kundenr)}</td>
        <td><a class="link" href="${esc(kundeUrl(k.kundenr))}" onclick="event.stopPropagation()">${esc(k.navn)}</a></td>
        <td>${esc(k.omraade)}</td>
        <td>${esc(k.kundestatus)}</td>
        <td class="small" title="${esc(kontraktTitle(k))}">${esc(k.kontrakt || '')}</td>
        <td style="white-space:nowrap;"><a class="btn" href="/kundeinfo.html?kundenr=${encodeURIComponent(k.kundenr)}" onclick="event.stopPropagation()">Info</a> <a class="btn" href="${esc(kundeUrl(k.kundenr))}" onclick="event.stopPropagation()">Åbn</a> <a class="btn" href="${esc(produktUrl(k.kundenr))}" onclick="event.stopPropagation()" title="Åbn kundens produktliste">Produkt</a></td>
      </tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">Ingen kunder</td></tr>';
    }
    load().catch(e => setStatus('error', e.message));
  </script>
</body>
</html>
