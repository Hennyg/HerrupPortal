<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bekræft booking</title>

  <style>
    body { font-family: system-ui, Arial; background:#f5f7fa; margin:20px; }
    .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 4px 10px rgba(0,0,0,.08); max-width:520px; margin:auto; }
    h1 { margin:0 0 10px 0; font-size:20px; }
    .muted { color:#566; margin:6px 0 14px 0; }
    .row { margin:6px 0; }
    .bad { color:#b00020; font-weight:600; }
    .ok  { color:#0a6; font-weight:600; }

    /* Slider */
    .sliderWrap {
      margin-top:16px;
      background:#eef1f6;
      border-radius:999px;
      padding:6px;
      position:relative;
      user-select:none;
      touch-action:none;
      overflow:hidden;
    }
    .sliderText {
      position:absolute;
      left:0; right:0; top:0; bottom:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#345;
      font-weight:600;
      pointer-events:none;
    }
    .knob {
      width:56px; height:56px;
      border-radius:999px;
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:700;
      cursor:grab;
      position:relative;
      transform:translateX(0px);
    }
    .knob:active { cursor:grabbing; }
    .bar {
      position:absolute;
      left:6px; top:6px; bottom:6px;
      width:56px;
      background:#cfe8ff;
      border-radius:999px;
      z-index:0;
      transition:width .1s;
    }
    button.link { margin-top:14px; background:none; border:none; color:#06c; cursor:pointer; padding:0; }
    .spinner { display:none; margin-top:12px; }
    .spinner.show { display:block; }
    code { background:#f2f2f2; padding:2px 6px; border-radius:6px; }

    /* Book for en anden - kun synlig for medlemmer af portal_flyveborde_bookforandre (eller portal_admin) */
    .bookForWrap { display:none; margin-top:14px; padding-top:12px; border-top:1px solid #e5e9f0; }
    .bookForRow { display:flex; align-items:center; gap:8px; }
    .bookForRow label { font-weight:600; cursor:pointer; }
    #bookForEmail {
      display:none;
      margin-top:8px;
      width:100%;
      box-sizing:border-box;
      padding:8px 10px;
      border:1px solid #ccd3dc;
      border-radius:8px;
      font-size:14px;
    }
  </style>

  <!-- MSAL -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>

<body>
  <div class="card">
    <h1 id="pageTitle">Bekræft booking</h1>
    <div class="muted" id="pageSubtitle">Træk knappen hele vejen til højre for at oprette bookingen.</div>

    <div class="row"><b>Lokale:</b> <span id="desk"></span></div>
    <div class="row"><b>Slot:</b> <span id="slot"></span></div>
    <div class="row" id="bookedByRow" style="display:none;"></div>

    <div id="bookForWrap" class="bookForWrap">
      <div class="bookForRow">
        <input type="checkbox" id="bookForToggle">
        <label for="bookForToggle">Book for en anden</label>
      </div>
      <input type="email" id="bookForEmail" placeholder="kollegaens@lcherrup.dk">
    </div>

    <div id="msg" class="row"></div>

    <div class="sliderWrap" id="slider">
      <div class="bar" id="bar"></div>
      <div class="sliderText" id="sliderText">Træk for at bekræfte</div>
      <div class="knob" id="knob">→</div>
    </div>

    <div class="spinner" id="spin">Opretter booking…</div>
    <button class="link" id="cancel">← Tilbage</button>
  </div>

<script>
(async () => {
  // ========= PARAMS =========
  const tz = "Europe/Copenhagen";
  const PENDING_KEY = "flyveborde_pending_booking";

  const qs = new URLSearchParams(location.search);

  const deskParamRaw = (qs.get("desk") || "").trim();
  const slot = (qs.get("slot") || "").toLowerCase().trim(); // am|pm|day
  const dateParamRaw = (qs.get("date") || "").trim();       // ønsket dato fra link
  const typeParam = (qs.get("type") || "flyveborde").toLowerCase().trim(); // flyveborde|biler|trailer
  const isFlyveborde = typeParam === "flyveborde";
  const autoConfirmRequested = qs.get("autoconfirm") === "1";
  const validSlots = ["am","pm","day"];
  const mode = (qs.get("mode") || "book").toLowerCase().trim(); // "book" (standard) | "cancel"
  const isCancelMode = mode === "cancel";

  // Fjern autoconfirm=1 fra adresselinjen med det samme, så et evt. genindlæs
  // af siden ikke forsøger at booke igen.
  if (autoConfirmRequested) {
    const cleaned = new URLSearchParams(qs);
    cleaned.delete("autoconfirm");
    const cleanUrl = `${location.pathname}${cleaned.toString() ? "?" + cleaned.toString() : ""}`;
    history.replaceState(null, "", cleanUrl);
  }

  const deskEl = document.getElementById("desk");
  const slotEl = document.getElementById("slot");
  const msgEl  = document.getElementById("msg");
  const spin   = document.getElementById("spin");

  // --- Normaliser desk id til localStorage nøgle ---
  function deskKey(s){ return String(s || "").trim().toLowerCase(); }
  const deskKeyValue = deskKey(deskParamRaw);

  deskEl.textContent = deskParamRaw || "(mangler)";
  document.getElementById("cancel").addEventListener("click", () => history.back());

  // ========= DATOVÆRKTØJ =========
  // I18N helpers for dato i bestemt tidszone
  function fmtPart(d, opt) { return new Intl.DateTimeFormat("sv-SE", { timeZone: tz, ...opt }).format(d); }
  function todayIsoLocalTZ() {
    const now = new Date();
    return `${fmtPart(now,{year:"numeric"})}-${fmtPart(now,{month:"2-digit"})}-${fmtPart(now,{day:"2-digit"})}`;
  }

  // Normalize input:
  // - "2026-02-07" -> "2026-02-07"
  // - "07-02-2026" -> "2026-02-07"
  // - "2026-02-07T00:00:00Z" -> "2026-02-07"
  function normalizeDateParam(s) {
    if (!s) return "";
    const t = String(s).trim();
    if (t.includes("T")) return t.split("T")[0];
    if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
    if (/^\d{2}-\d{2}-\d{4}$/.test(t)) {
      const [dd,mm,yyyy] = t.split("-");
      return `${yyyy}-${mm}-${dd}`;
    }
    return t; // fallback (server kan evt. afvise)
  }

  const selectedIso = normalizeDateParam(dateParamRaw) || todayIsoLocalTZ();

  function sameIsoDate(a, b) { return String(a) === String(b); }

  // ========= UI HELPERS =========
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function setMsgOk(html){ msgEl.innerHTML = `<span class="ok">${html}</span>`; }
  function setMsgBad(html){ msgEl.innerHTML = `<span class="bad">${html}</span>`; }
  function formatTime(isoLocalDateTime) {
    const t = isoLocalDateTime.split("T")[1]?.slice(0,5);
    return t || isoLocalDateTime;
  }
  function dkDate(iso){ const [y,m,d] = String(iso).split("-"); return `${d}-${m}-${y}`; }

  function disableSlider() {
    slider.style.opacity = 0.5;
    slider.style.pointerEvents = "none";
  }
  function enableSlider() {
    slider.style.opacity = 1;
    slider.style.pointerEvents = "auto";
  }

  // ========= MSAL / TOKEN =========
  if (typeof window.msal === "undefined") {
    setMsgBad("MSAL kunne ikke indlæses. Tjek netværk/CSP.");
    disableSlider();
    return;
  }

  const CLIENT_ID = "b0e2b0ad-f77a-474c-acae-506e8a925ae6";
  const TENANT_ID = "5fbd2064-b472-4740-b035-3cb52bb46de4";

  const msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: CLIENT_ID,
      authority: `https://login.microsoftonline.com/${TENANT_ID}`,
      redirectUri: location.origin,
      postLogoutRedirectUri: location.origin
    },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
  });

  // Skal altid kaldes ved sideindlæsning, så MSAL kan afslutte en evt.
  // igangværende redirect-login (fx når vi kommer tilbage fra index.html).
  try {
    await msalInstance.handleRedirectPromise();
  } catch (e) {
    console.error("MSAL redirect-fejl:", e);
  }

  const GRAPH_SCOPES = ["openid", "profile", "offline_access", "Calendars.ReadWrite"];

  function savePendingBooking() {
    sessionStorage.setItem(PENDING_KEY, JSON.stringify({
      desk: deskParamRaw,
      slot,
      date: selectedIso,
      type: typeParam,
      mode // "book" eller "cancel" - så index.html sender os tilbage til det rigtige flow
    }));
  }

  // Prøver pop-up-login/token først (hurtigst, ét enkelt swipe). Hvis pop-up'en
  // bliver blokeret – typisk fordi siden er åbnet i en indlejret webvisning,
  // fx via "Herrup Portalen" på hjemmeskærmen på iPhone – falder vi automatisk
  // tilbage til redirect-login, som virker overalt. Brugeren sendes til
  // Microsoft-login og føres bagefter automatisk tilbage hertil, hvor
  // bookingen færdiggøres selv.
  async function getGraphToken() {
    let account = msalInstance.getAllAccounts()[0];

    if (!account) {
      try {
        const loginResp = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES, prompt: "select_account" });
        account = loginResp.account;
      } catch (popupErr) {
        console.warn("Pop-up login fejlede, skifter til redirect:", popupErr);
        savePendingBooking();
        await msalInstance.loginRedirect({ scopes: GRAPH_SCOPES, prompt: "select_account" });
        return null; // siden navigerer væk nu – intet efter dette punkt vil køre
      }
    }

    try {
      const tokenResp = await msalInstance.acquireTokenSilent({ account, scopes: GRAPH_SCOPES });
      return tokenResp.accessToken;
    } catch {
      try {
        const tokenResp = await msalInstance.acquireTokenPopup({ scopes: GRAPH_SCOPES, prompt: "select_account" });
        return tokenResp.accessToken;
      } catch (popupErr) {
        console.warn("Pop-up token fejlede, skifter til redirect:", popupErr);
        savePendingBooking();
        await msalInstance.acquireTokenRedirect({ scopes: GRAPH_SCOPES, prompt: "select_account" });
        return null; // siden navigerer væk nu
      }
    }
  }

  // ========= BOOK FOR EN ANDEN (kun synligt for portal_flyveborde_bookforandre / portal_admin) =========
  // Tjekket her er RENT KOSMETISK - det bestemmer kun om feltet vises.
  // Den reelle ret tjekkes uafhængigt server-side i /api/bookdeskforother,
  // uanset hvad denne funktion finder frem til.
  const bookForWrap   = document.getElementById("bookForWrap");
  const bookForToggle = document.getElementById("bookForToggle");
  const bookForEmail  = document.getElementById("bookForEmail");

  bookForToggle?.addEventListener("change", () => {
    bookForEmail.style.display = bookForToggle.checked ? "block" : "none";
    if (!bookForToggle.checked) bookForEmail.value = "";
  });

  async function getSilentOid() {
    let acc = msalInstance.getAllAccounts()[0];
    if (!acc) {
      const result = await msalInstance.ssoSilent({ scopes: ["openid", "profile"] });
      acc = result.account;
    }
    return acc?.idTokenClaims?.oid || acc?.localAccountId || null;
  }

  async function checkBookForOthersAccess() {
    try {
      const oid = await getSilentOid();
      if (!oid) return;

      const res = await fetch(`/api/checkbookforothers?oid=${encodeURIComponent(oid)}`, { cache: "no-store" });
      if (!res.ok) return;

      const data = await res.json();
      if (data?.allowed) {
        bookForWrap.style.display = "block";
      }
    } catch {
      // Ingen aktiv session / ikke medlem -> feltet forbliver skjult, ingen fejl vises
    }
  }

  // I annulleringstilstand er "book for en anden"-feltet irrelevant - i
  // stedet tjekker vi den SAMME rettighed (portal_flyveborde_bookforandre
  // eller portal_admin) for at afgøre om sliden overhovedet må bruges. Den
  // egentlige kontrol foretages uafhængigt igen server-side i
  // /api/cancelbooking, uanset hvad dette tjek finder.
  async function checkCancelAccess() {
    try {
      const oid = await getSilentOid();
      if (!oid) throw new Error("no-session");

      const res = await fetch(`/api/checkbookforothers?oid=${encodeURIComponent(oid)}`, { cache: "no-store" });
      const data = res.ok ? await res.json() : null;
      if (!data?.allowed) throw new Error("not-allowed");
    } catch {
      setMsgBad("Du har ikke rettighed til at annullere denne booking.");
      disableSlider();
    }
  }

  // "Book for en anden" og "annuller booking" er kun bygget til flyveborde
  // (Dataverse + FlyvebordeGroupMail). For biler/trailer springes begge
  // tjek helt over.
  if (isFlyveborde) {
    if (isCancelMode) {
      checkCancelAccess();
    } else {
      checkBookForOthersAccess();
    }
  }

  // ========= SLOT -> TIMES baseret på VALGT DATO =========
  function slotToTimes(slotKey, dateIso) {
    // dateIso forventes i "YYYY-MM-DD"
    const baseDate = dateIso || todayIsoLocalTZ();

    let start = "07:00:00", end = "16:00:00";
    if (slotKey === "am") end = "12:00:00";
    else if (slotKey === "pm") start = "12:00:00";
    else if (slotKey === "day") { start = "07:00:00"; end = "16:00:00"; }

    return {
      start: { dateTime: `${baseDate}T${start}`, timeZone: tz },
      end:   { dateTime: `${baseDate}T${end}`,   timeZone: tz }
    };
  }

  // Viser slot+tider for den valgte dato
  function renderSlotLabel() {
    const times = slotToTimes(slot, selectedIso);
    slotEl.textContent = `${slot.toUpperCase()} (${dkDate(selectedIso)} • ${formatTime(times.start.dateTime)} - ${formatTime(times.end.dateTime)})`;
  }

  // ========= TIDSHJÆLPERE =========
  // Returnerer lokal ISO "YYYY-MM-DDTHH:mm:00" i given tidszone for nu + minutes
  function nowPlusMinutesLocalIso(minutes) {
    const t = new Date(Date.now() + (minutes * 60 * 1000));
    const y = fmtPart(t,{year:"numeric"});
    const mo= fmtPart(t,{month:"2-digit"});
    const d = fmtPart(t,{day:"2-digit"});
    const hh= fmtPart(t,{hour:"2-digit", hour12:false});
    const mi= fmtPart(t,{minute:"2-digit"});
    return `${y}-${mo}-${d}T${hh}:${mi}:00`;
  }

  // String-baseret sammenligning af lokale ISO’er; virker da formatet er fast bredde
  function isoLocalGreater(a, b) { return a.localeCompare(b) > 0; }
  function isoLocalGreaterOrEqual(a, b) { return a.localeCompare(b) >= 0; }

  // ========= API (re-check) =========
  async function loadDeskStatus() {
    // Flyveborde: uændret, Dataverse-backed. Biler/trailer: live fra kalenderen, ingen Dataverse.
    const url = isFlyveborde
      ? `/api/flyveborde?desk=${encodeURIComponent(deskParamRaw)}&date=${encodeURIComponent(selectedIso)}`
      : `/api/liveresources?type=${encodeURIComponent(typeParam)}&desk=${encodeURIComponent(deskParamRaw)}&date=${encodeURIComponent(selectedIso)}`;
    const r = await fetch(url, { headers: { "Accept": "application/json" }});
    const t = await r.text();
    if (!r.ok) throw new Error(`API ${r.status}: ${t}`);
    const obj = JSON.parse(t);
    return Array.isArray(obj) ? obj[0] : obj;
  }

  function isSlotFreeFromApi(target, slotKey) {
    if (slotKey === "am")  return target.AM === false;
    if (slotKey === "pm")  return target.PM === false;
    if (slotKey === "day") return (target.Day === false) || (!target.AM && !target.PM);
    return false;
  }

  // ========= SLIDER =========
  const slider = document.getElementById("slider");
  const knob   = document.getElementById("knob");
  const bar    = document.getElementById("bar");
  const sliderText = document.getElementById("sliderText");

  let dragging = false;
  let startX = 0;
  let knobX = 0;
  let maxX = 0;
  let confirmed = false;

  function layout() {
    const wrapRect = slider.getBoundingClientRect();
    const knobRect = knob.getBoundingClientRect();
    maxX = (wrapRect.width - 12) - knobRect.width;
  }
  window.addEventListener("resize", layout);
  layout();

  function setKnob(x) {
    knobX = Math.max(0, Math.min(maxX, x));
    knob.style.transform = `translateX(${knobX}px)`;
    bar.style.width = `${56 + knobX}px`;
  }

  function onDown(e) {
    if (confirmed) return;
    dragging = true;
    knob.style.transition = "none";
    bar.style.transition = "none";
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    layout();
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging || confirmed) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - startX;
    setKnob(knobX + dx);
    startX = x;
    e.preventDefault();
  }
  async function onUp() {
    if (!dragging || confirmed) return;
    dragging = false;

    const threshold = maxX * 0.92;
    if (knobX >= threshold) {
      await confirmAndBook();
    } else {
      knob.style.transition = "transform .15s";
      bar.style.transition = "width .15s";
      setKnob(0);
    }
  }

  async function confirmAndBook() {
    confirmed = true;
    sliderText.textContent = "Bekræftet ✓";
    spin.classList.add("show");
    disableSlider();
    if (isCancelMode) {
      await cancelBookingAction();
    } else {
      await createBooking();
    }
  }

  knob.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  knob.addEventListener("touchstart", onDown, {passive:false});
  window.addEventListener("touchmove", onMove, {passive:false});
  window.addEventListener("touchend", onUp);

  // ========= BOOKING =========
  const START_OFFSET_MIN = 1; // min. – hvis i dag, fx 08:02 -> starter 08:03

  async function createBooking() {
    try {
      msgEl.innerHTML = "";

      // Re-check mod dit API (for at undgå race)
      const latest = await loadDeskStatus();
      if (!latest?.resourceMail) {
        throw new Error("Flyvebordet findes ikke længere i adgangsgruppen eller mangler mailadresse.");
      }
      if (!isSlotFreeFromApi(latest, slot)) {
        throw new Error(`Kan ikke booke – ${slot.toUpperCase()} er netop blevet optaget for ${dkDate(selectedIso)}.`);
      }

      // Udregn slot-tider for VALGT dato
      const base = slotToTimes(slot, selectedIso);

      // Hvis den valgte dato er i dag, så må start ikke ligge bagud (nu + offset)
      let finalStart = base.start.dateTime;
      if (sameIsoDate(selectedIso, todayIsoLocalTZ())) {
        const candidateStart = nowPlusMinutesLocalIso(START_OFFSET_MIN);
        if (isoLocalGreater(candidateStart, finalStart)) {
          finalStart = candidateStart;
        }
        // Er der stadig tid tilbage i slot'et i dag?
        if (isoLocalGreaterOrEqual(finalStart, base.end.dateTime)) {
          throw new Error(`For lidt tid tilbage i dette slot i dag (slutter ${formatTime(base.end.dateTime)}). Vælg et andet slot.`);
        }
      }

      const token = await getGraphToken();
      if (!token) {
        // Ingen token endnu – vi er på vej til Microsoft-login via redirect.
        // Siden navigerer væk om et øjeblik; lad spinneren blive stående.
        return;
      }

      // ===== Book for en anden – server-side flow (app-only Graph) =====
      const targetMail = (bookForToggle?.checked && bookForEmail?.value.trim()) || "";
      if (targetMail) {
        // NB: SWA's linkede function-integration overskriver den almindelige
        // "Authorization"-header med sin egen interne token, før kaldet når
        // frem til vores function - derfor sender vi MSAL-tokenet i et
        // separat, custom header ("X-Graph-Token") i stedet. Serveren læser
        // dette header, ikke Authorization.
        const resp = await fetch("/api/bookdeskforother", {
          method: "POST",
          headers: { "X-Graph-Token": token, "Content-Type": "application/json" },
          body: JSON.stringify({
            deskId: deskParamRaw,
            slot,
            date: selectedIso,
            targetMail
          })
        });

        const text = await resp.text();
        let payload = {};
        try { payload = text ? JSON.parse(text) : {}; } catch { payload = {}; }
        if (!resp.ok) {
          throw new Error(payload?.error || text || `API ${resp.status}`);
        }

        localStorage.setItem(`lock-${deskKeyValue}-${selectedIso}-${slot}`, String(Date.now()));

        setMsgOk(`Booking oprettet ✅ for ${escapeHtml(payload.bookedFor || targetMail)} (${dkDate(selectedIso)}, ${slot.toUpperCase()}). Tjek Outlook for bekræftelse.`);
        spin.classList.remove("show");
        return;
      }

      // ===== Book for sig selv – uændret, nuværende flow =====
      const roomMail = latest.resourceMail;

      const event = {
        subject: `Booking af ${deskParamRaw} (${slot.toUpperCase()}) – ${dkDate(selectedIso)}`,
        showAs: "free",
        location: { displayName: deskParamRaw },
        start: { dateTime: finalStart, timeZone: tz },
        end:   { dateTime: base.end.dateTime, timeZone: tz },
        attendees: [{
          emailAddress: { address: roomMail, name: deskParamRaw },
          type: "resource"
        }],
        body:  {
          contentType: "HTML",
          content: `
            <div><b>Lokale:</b> ${escapeHtml(deskParamRaw)}</div>
            <div><b>Dato:</b> ${dkDate(selectedIso)}</div>
            <div><b>Slot:</b> ${escapeHtml(slot.toUpperCase())} (${formatTime(finalStart)} - ${formatTime(base.end.dateTime)})</div>
            <div><a href="${location.origin}/status.html?desk=${encodeURIComponent(deskParamRaw)}">Åbn status</a></div>
          `
        }
      };

      const resp = await fetch("https://graph.microsoft.com/v1.0/me/events", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(event)
      });

      const text = await resp.text();
      if (!resp.ok) throw new Error(`Graph ${resp.status}: ${text}`);

      // === Bekræft med det samme i Dataverse (best-effort) ===
      // KUN relevant for flyveborde (Dataverse-backed). Biler/trailer er
      // allerede "øjeblikkelige" af natur, da status læses direkte fra
      // kalenderen - der findes intet at bekræfte, og intet at skrive.
      if (isFlyveborde) {
        try {
          await fetch("/api/confirmbooking", {
            method: "POST",
            headers: { "X-Graph-Token": token, "Content-Type": "application/json" },
            body: JSON.stringify({ deskId: deskParamRaw, slot, date: selectedIso })
          });
        } catch (confirmErr) {
          console.warn("Kunne ikke bekræfte i Dataverse med det samme (runbook retter det):", confirmErr);
        }
      }

      // === Sæt lock (KUN kosmetisk) ===
      // Inkluder dato i nøglen, så den matcher din status-side
      localStorage.setItem(`lock-${deskKeyValue}-${selectedIso}-${slot}`, String(Date.now()));

      setMsgOk(`Booking oprettet ✅ ${dkDate(selectedIso)} (${formatTime(finalStart)}–${formatTime(base.end.dateTime)}). Tjek Outlook for bekræftelse.`);
      spin.classList.remove("show");

    } catch (err) {
      spin.classList.remove("show");

      const rawMsg = err?.message || String(err);
      let hint = "";
      if (/popup/i.test(rawMsg)) {
        hint = " Prøv at åbne siden i din normale browser (fx via del-ikonet → \"Åbn i Safari/Chrome\") i stedet for fra hjemmeskærm-genvejen, og prøv igen.";
      }
      setMsgBad(`Booking fejlede: ${escapeHtml(rawMsg)}${escapeHtml(hint)}`);

      // reset slider
      confirmed = false;
      enableSlider();
      sliderText.textContent = "Træk for at bekræfte";
      setKnob(0);
    }
  }

  // ========= ANNULLERING (mode=cancel) =========
  // Genbruger samme slider-UX som booking, men kalder /api/cancelbooking
  // i stedet. Rettigheden tjekkes uafhængigt server-side der (samme gruppe
  // som "book for en anden"), uanset hvad checkCancelAccess() fandt.
  async function cancelBookingAction() {
    try {
      msgEl.innerHTML = "";

      const token = await getGraphToken();
      if (!token) {
        // På vej til Microsoft-login via redirect - siden navigerer væk.
        return;
      }

      const resp = await fetch("/api/cancelbooking", {
        method: "POST",
        headers: { "X-Graph-Token": token, "Content-Type": "application/json" },
        body: JSON.stringify({ deskId: deskParamRaw, slot, date: selectedIso })
      });

      const text = await resp.text();
      let payload = {};
      try { payload = text ? JSON.parse(text) : {}; } catch { payload = {}; }
      if (!resp.ok) {
        throw new Error(payload?.error || text || `API ${resp.status}`);
      }

      localStorage.removeItem(`lock-${deskKeyValue}-${selectedIso}-${slot}`);

      setMsgOk(`Booking annulleret ✅ (${dkDate(selectedIso)}, ${slot.toUpperCase()}).`);
      spin.classList.remove("show");

    } catch (err) {
      spin.classList.remove("show");
      setMsgBad(`Annullering fejlede: ${escapeHtml(err?.message || String(err))}`);

      confirmed = false;
      enableSlider();
      sliderText.textContent = "Træk for at annullere";
      setKnob(0);
    }
  }

  // ========= INIT =========
  if (!deskParamRaw || !validSlots.includes(slot)) {
    setMsgBad(`Ugyldig URL. Skal være <code>select.html?desk=adm04&slot=am&date=YYYY-MM-DD</code>`);
    disableSlider();
    return;
  }
  // (valgfrit) valider datoformatet lidt mere
  if (!/^\d{4}-\d{2}-\d{2}$/.test(selectedIso)) {
    setMsgBad(`Datoen '${escapeHtml(dateParamRaw)}' kunne ikke fortolkes. Brug <code>YYYY-MM-DD</code>.`);
    disableSlider();
    return;
  }

  renderSlotLabel();

  // ========= Tekster/opsætning specifikt for annulleringstilstand =========
  if (isCancelMode) {
    document.title = "Annuller booking";
    document.getElementById("pageTitle").textContent = "Annuller booking";
    document.getElementById("pageSubtitle").textContent = "Træk knappen hele vejen til højre for at annullere bookingen.";
    sliderText.textContent = "Træk for at annullere";

    if (isFlyveborde) {
      (async () => {
        try {
          const latest = await loadDeskStatus();
          const byField = slot === "am" ? latest?.AMBy : slot === "pm" ? latest?.PMBy : latest?.DayBy;
          const isBooked = slot === "am" ? latest?.AM === true : slot === "pm" ? latest?.PM === true : latest?.Day === true;

          if (!isBooked) {
            setMsgBad(`${deskParamRaw} er ikke booket for ${slot.toUpperCase()} den ${dkDate(selectedIso)} længere.`);
            disableSlider();
            return;
          }

          const byRow = document.getElementById("bookedByRow");
          if (byField) {
            byRow.innerHTML = `<b>Booket af:</b> ${escapeHtml(byField)}`;
            byRow.style.display = "block";
          }
        } catch (e) {
          console.warn("Kunne ikke hente bookingstatus til annullering:", e);
        }
      })();
    }
  }

  // ========= SLIDER WIRING (efter init) =========
  function setKnobInitial() { setKnob(0); }
  setKnobInitial();

  // Kommer vi tilbage fra en redirect-login med et gyldigt login? Så
  // færdiggør vi bookingen automatisk uden at brugeren skal swipe igen.
  if (autoConfirmRequested && msalInstance.getAllAccounts().length > 0) {
    await confirmAndBook();
  }

})();
</script>
</body>
</html>
