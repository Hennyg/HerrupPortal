<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Statistik – Herrup Portalen</title>
<meta name="theme-color" content="#c30a14">
<link rel="stylesheet" href="/assets/app.css?v=20260930-bd1" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">

<style>
  .statbar { background: var(--accent-bar); color: #fff; text-align: center; font-weight: 700; padding: .7rem 1rem; }
  .toolbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  .range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .range input { border: 1px solid #d1d5db; border-radius: 6px; padding: .4rem; }
  .range .btn.on { background: var(--nav-bg); color: #fff; border-color: transparent; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: #f9fafb; border-radius: 10px; padding: 12px 14px; }
  .card .v { font-size: 1.6rem; font-weight: 700; color: var(--heading); }
  .card .k { font-size: .85rem; color: #6b7280; }

  h2 { color: var(--heading); font-size: 1.15rem; margin: 0 0 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 1rem; }
  .tbl-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.t th, table.t td { padding: 6px 8px; border-bottom: 1px solid var(--divider); text-align: left; }
  table.t th { color: #6b7280; font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
  table.t td.w { width: 35%; }
  .bar { height: 10px; background: #eef1f6; border-radius: 5px; min-width: 60px; }
  .bar > span { display: block; height: 100%; border-radius: 5px; background: var(--nav-accent); }

  .days { display: flex; align-items: flex-end; gap: 2px; height: 150px; padding-top: 6px; }
  .days .d { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-width: 3px; }
  .days .d .pv { background: var(--nav-accent); border-radius: 3px 3px 0 0; }
  .days .d .ck { background: var(--nav-bg); }
  .axis { display: flex; justify-content: space-between; font-size: .75rem; color: #6b7280; margin-top: 4px; }
  .hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 110px; }
  .hours div { background: var(--nav-accent); border-radius: 2px 2px 0 0; }
  .hours-axis { display: grid; grid-template-columns: repeat(24, 1fr); font-size: .65rem; color: #6b7280; text-align: center; }
  .lg { font-size: .8rem; color: #6b7280; display: flex; gap: 14px; margin-bottom: 6px; }
  .lg span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .lg .pv::before { background: var(--nav-accent); }
  .lg .ck::before { background: var(--nav-bg); }
  .note { background: #fff7e0; border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: .9rem; }
  .err { color: #b91c1c; font-weight: 600; }

  .news-item { border-bottom: 1px solid var(--divider); }
  .news-item summary { display: grid; grid-template-columns: 1fr auto auto auto; gap: 14px; align-items: center; padding: 8px 4px; cursor: pointer; list-style: none; }
  .news-item summary::-webkit-details-marker { display: none; }
  .news-item summary::before { content: "▸"; color: #6b7280; margin-right: 6px; }
  .news-item[open] summary::before { content: "▾"; }
  .news-item .ttl { font-weight: 600; color: var(--heading); display: flex; align-items: baseline; gap: 2px; min-width: 0; }
  .news-item .ttl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .news-item .cat { font-size: .78rem; color: #6b7280; }
  .news-item .num { font-size: .85rem; white-space: nowrap; text-align: right; }
  .news-item .readers { padding: 0 4px 10px 22px; }
  .news-filter { border: 1px solid #d1d5db; border-radius: 6px; padding: .4rem .6rem; width: 100%; max-width: 320px; margin-bottom: 8px; }
</style>
</head>

<body>
<div class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <div class="logo" aria-label="Herrup Portal"></div>
      <div>Herrup Portalen</div>
    </div>
    <div class="nav">
      <a href="/">Forside</a>
      <a href="/admin.html">Admin</a>
      <a href="/logout">Log ud</a>
    </div>
  </div>
  <div class="nav-accent"></div>
</div>
<div class="statbar">Statistik – brug af portalen</div>

<div class="container">
  <div class="panel">
    <div class="toolbar">
      <div class="range">
        <label for="from">Fra</label><input type="date" id="from">
        <label for="to">Til</label><input type="date" id="to">
        <button class="btn" data-preset="7">7 dage</button>
        <button class="btn" data-preset="30">30 dage</button>
        <button class="btn" data-preset="month">Denne måned</button>
        <button class="btn" data-preset="lastmonth">Sidste måned</button>
      </div>
      <button class="btn" id="refresh">↻ Opdater</button>
    </div>
    <div id="note"></div>
  </div>

  <div id="content"><div class="panel">Indlæser…</div></div>
</div>

<script>
(() => {
  const TZ = "Europe/Copenhagen";
  const $ = id => document.getElementById(id);
  const content = $("content"), fromEl = $("from"), toEl = $("to");

  const pad2 = n => String(n).padStart(2, "0");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const fmt = n => Number(n || 0).toLocaleString("da-DK");
  const todayIso = () => new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  function addDays(iso, n) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d)); dt.setUTCDate(dt.getUTCDate() + n);
    return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
  }
  const dk = iso => { const [y, m, d] = iso.split("-"); return `${d}-${m}-${y}`; };
  const dkTime = utc => {
    const s = new Intl.DateTimeFormat("sv-SE", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(utc));
    const [d, t] = s.split(" "); return `${dk(d)} ${t}`;
  };

  function setRange(preset) {
    const t = todayIso();
    if (preset === "7") { fromEl.value = addDays(t, -6); toEl.value = t; }
    else if (preset === "30") { fromEl.value = addDays(t, -29); toEl.value = t; }
    else if (preset === "month") { fromEl.value = t.slice(0, 8) + "01"; toEl.value = t; }
    else if (preset === "lastmonth") {
      const lastPrev = addDays(t.slice(0, 8) + "01", -1);
      fromEl.value = lastPrev.slice(0, 8) + "01"; toEl.value = lastPrev;
    }
    document.querySelectorAll("[data-preset]").forEach(b => b.classList.toggle("on", b.dataset.preset === preset));
  }
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => { setRange(b.dataset.preset); load(); }));
  $("refresh").addEventListener("click", load);
  fromEl.addEventListener("change", () => { setRange(null); load(); });
  toEl.addEventListener("change", () => { setRange(null); load(); });

  async function load() {
    content.style.opacity = ".5";
    try {
      const res = await fetch(`/api/portalstats?from=${fromEl.value}&to=${toEl.value}&t=${Date.now()}`, { cache: "no-store" });
      const text = await res.text();
      let d = {};
      try { d = text ? JSON.parse(text) : {}; } catch { /* ikke JSON */ }
      if (!res.ok) throw new Error(d?.details || d?.error || `API ${res.status}`);
      render(d);
    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="panel err">Kunne ikke hente statistik: ${esc(err.message || err)}</div>`;
    } finally {
      content.style.opacity = "1";
    }
  }

  const card = (v, k) => `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`;

  function table(rows, cols) {
    if (!rows.length) return `<div class="muted">Ingen data</div>`;
    const max = Math.max(1, ...rows.map(r => r.count || 0));
    return `<div class="tbl-wrap"><table class="t"><thead><tr>${cols.map(c => `<th class="${c.n ? "n" : ""}">${c.h}</th>`).join("")}<th></th></tr></thead><tbody>
      ${rows.map(r => `<tr>${cols.map(c => `<td class="${c.n ? "n" : ""}">${c.f(r)}</td>`).join("")}<td class="w"><div class="bar"><span style="width:${(r.count / max) * 100}%"></span></div></td></tr>`).join("")}
    </tbody></table></div>`;
  }

  function render(d) {
    const t = d.totals;
    $("note").innerHTML = d.hasClickColumns ? "" :
      `<div class="note">Klik på tiles registreres ikke endnu. Opret kolonnerne lch_eventtype, lch_targettitle, lch_targeturl og lch_targetcategory i tabellen lch_accesslog (Tekst på enkelt linje).</div>`;

    const days = d.byDay || [];
    const maxDay = Math.max(1, ...days.map(x => x.pageviews + x.clicks));
    const maxHour = Math.max(1, ...d.byHour.map(x => x.pageviews));

    content.innerHTML = `
      <div class="panel">
        <h2>Overblik ${esc(dk(d.from))} – ${esc(dk(d.to))}</h2>
        <div class="cards">
          ${card(fmt(t.pageviews), "Sidevisninger")}
          ${card(fmt(t.uniqueUsers), "Unikke brugere")}
          ${card(fmt(t.avgUsersPerActiveDay), "Brugere pr. dag (gns.)")}
          ${card(fmt(t.clicks), "Klik på tiles")}
          ${card(fmt(t.newsViews), "Læste nyheder")}
        </div>
        ${d.truncated ? `<div class="note">Perioden har meget data – kun de første 100.000 rækker er talt med.</div>` : ""}
      </div>

      <div class="panel">
        <h2>Brug pr. dag</h2>
        <div class="lg"><span class="pv">Sidevisninger</span><span class="ck">Klik på tiles</span></div>
        <div class="days">${days.map(x => `
          <div class="d" title="${esc(dk(x.date))}: ${x.pageviews} sidevisninger, ${x.clicks} klik, ${x.uniqueUsers} brugere">
            <div class="pv" style="height:${(x.pageviews / maxDay) * 140}px"></div>
            <div class="ck" style="height:${(x.clicks / maxDay) * 140}px"></div>
          </div>`).join("")}</div>
        <div class="axis"><span>${days.length ? esc(dk(days[0].date)) : ""}</span><span>${days.length ? esc(dk(days[days.length - 1].date)) : ""}</span></div>
      </div>

      <div class="panel grid2">
        <div>
          <h2>Tidspunkt på dagen</h2>
          <div class="hours">${d.byHour.map(x => `<div title="kl. ${pad2(x.hour)}: ${x.pageviews}" style="height:${(x.pageviews / maxHour) * 100}%"></div>`).join("")}</div>
          <div class="hours-axis">${d.byHour.map(x => `<span>${x.hour % 3 === 0 ? pad2(x.hour) : ""}</span>`).join("")}</div>
        </div>
        <div>
          <h2>Ugedag</h2>
          ${table(d.byWeekday.map(x => ({ key: x.day, count: x.pageviews })), [
            { h: "Dag", f: r => esc(r.key) }, { h: "Visninger", n: 1, f: r => fmt(r.count) }])}
        </div>
      </div>

      <div class="panel">
        <h2>Mest klikkede tiles</h2>
        ${table(d.tiles, [
          { h: "Tile", f: r => r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.key)}</a>` : esc(r.key) },
          { h: "Kategori", f: r => esc(r.category || "") },
          { h: "Klik", n: 1, f: r => fmt(r.count) },
          { h: "Brugere", n: 1, f: r => fmt(r.uniqueUsers) }])}
      </div>

      <div class="panel grid2">
        <div>
          <h2>Sider</h2>
          ${table(d.pages, [
            { h: "Side", f: r => esc(r.key) },
            { h: "Visninger", n: 1, f: r => fmt(r.count) },
            { h: "Brugere", n: 1, f: r => fmt(r.uniqueUsers) }])}
        </div>
        <div>
          <h2>Klik pr. kategori</h2>
          ${table(d.categories, [
            { h: "Kategori", f: r => esc(r.key) },
            { h: "Klik", n: 1, f: r => fmt(r.count) },
            { h: "Brugere", n: 1, f: r => fmt(r.uniqueUsers) }])}
        </div>
      </div>

      <div class="panel grid2">
        <div>
          <h2>Enhed</h2>
          ${table(d.devices, [{ h: "Enhed", f: r => esc(r.key) }, { h: "Visninger", n: 1, f: r => fmt(r.count) }, { h: "Brugere", n: 1, f: r => fmt(r.uniqueUsers) }])}
        </div>
        <div>
          <h2>Browser</h2>
          ${table(d.browsers, [{ h: "Browser", f: r => esc(r.key) }, { h: "Visninger", n: 1, f: r => fmt(r.count) }, { h: "Brugere", n: 1, f: r => fmt(r.uniqueUsers) }])}
        </div>
      </div>

      <div class="panel">
        <h2>Nyheder – hvem har læst hvad</h2>
        <div class="muted" style="font-size:.85rem;margin-bottom:8px">Tæller når en nyhed åbnes (nyhed.html). Kun visninger i den valgte periode medtages.</div>
        ${newsSection(d.news || [])}
      </div>

      <div class="panel">
        <h2>Brugere</h2>
        ${d.users.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Bruger</th><th class="n">Sidevisninger</th><th class="n">Klik</th><th class="n">Nyheder</th><th class="n">Aktive dage</th><th class="n">Sidst set</th></tr></thead><tbody>
          ${d.users.map(u => `<tr><td>${esc(u.user)}</td><td class="n">${fmt(u.pageviews)}</td><td class="n">${fmt(u.clicks)}</td><td class="n">${fmt(u.newsViews)}</td><td class="n">${fmt(u.activeDays)}</td><td class="n">${esc(dkTime(u.lastSeen))}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="muted">Ingen data endnu</div>`}
      </div>`;

    const nf = $("newsFilter");
    if (nf) nf.addEventListener("input", () => {
      const q = nf.value.trim().toLowerCase();
      content.querySelectorAll(".news-item").forEach(el => {
        el.hidden = q && !el.dataset.search.includes(q);
      });
    });
  }

  function newsSection(news) {
    if (!news.length) return `<div class="muted">Ingen læste nyheder i perioden</div>`;
    return `
      <input type="search" id="newsFilter" class="news-filter" placeholder="Søg nyhed eller bruger…">
      ${news.map(n => `
        <details class="news-item" data-search="${esc((n.title + " " + n.readers.map(r => r.user).join(" ")).toLowerCase())}">
          <summary>
            <div class="ttl"><span>${esc(n.title)}</span></div>
            <div class="cat">${esc(n.category || "")}</div>
            <div class="num"><b>${fmt(n.uniqueUsers)}</b> læsere</div>
            <div class="num muted">${fmt(n.count)} visninger</div>
          </summary>
          <div class="readers">
            ${n.url ? `<div style="margin-bottom:6px"><a href="${esc(n.url)}" target="_blank" rel="noopener">Åbn nyheden ↗</a></div>` : ""}
            <div class="tbl-wrap"><table class="t"><thead><tr><th>Bruger</th><th class="n">Første gang</th><th class="n">Sidste gang</th><th class="n">Antal</th></tr></thead><tbody>
              ${n.readers.map(r => `<tr><td>${esc(r.user)}</td><td class="n">${esc(dkTime(r.first))}</td><td class="n">${esc(dkTime(r.last))}</td><td class="n">${fmt(r.count)}</td></tr>`).join("")}
            </tbody></table></div>
          </div>
        </details>`).join("")}`;
  }

  setRange("30");
  load();
})();
</script>
<script src="/assets/track.js" defer></script>
</body>
</html>
