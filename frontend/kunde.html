<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <title>Kundedetalje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/kundeliste/app.css" />
  <style>
    .addressChoice { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px 0; }
    .addressChoice .btn.active { background:#fdf2f2; border-color:var(--red); color:var(--red); }
    .productCountTable { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
    .productCountTable td { border-bottom:1px solid #eee; padding:6px 0; }
    .productCountTable td:last-child { text-align:right; font-weight:700; }
    .panelTitleLine { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:10px; }
    .panelTitleLine h2 { margin:0; }
    .panelTitleLine .toolbarSpacer { flex:1; }
  </style>
</head>
<body>
<div class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <div class="logo" aria-label="Herrup Portal"></div>
      <div id="brandTitle">Kundedetalje</div>
    </div>
    <div class="nav">
      <span id="userDisplay" class="muted" style="color:#fff;opacity:.9"></span>
      <span class="sep">|</span>
      <a href="/logout">Log ud</a>
    </div>
  </div>
  <div class="nav-accent"></div>
</div>
<main class="pageWrap">
  <div id="status" class="status loading"><div class="spinner"></div> Henter kunde...</div>
  <section id="content" style="display:none; overflow:auto;">
    <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;"><a id="btnBack" class="btn" href="/kundeliste.html">← Tilbage til kundeliste</a><a id="btnInfo" class="btn" href="/kundeinfo.html">Kundeinfo</a></div>
    <div class="cards" id="summary"></div>
    <div class="detailGrid">
      <div class="panel"><h2>Kunde</h2><div id="kundeInfo"></div></div>
      <div class="panel"><h2>Adresser</h2><div id="adresseInfo"></div></div>
      <div class="panel"><div class="panelTitleLine"><h2>Produkter</h2><span id="produktTopCounts" class="muted small"></span></div><div id="produktInfo"></div></div>
    </div>
    <div class="panel">
      <div class="panelTitleLine"><h2>Produkter pr. adresse</h2></div>
      <div class="tableWrap" style="max-height:55vh"><table class="dataTable"><thead><tr><th>Produkt</th><th>Produktnr.</th><th>Serienr.</th><th>Kontrakt</th><th>Datoer</th><th>Aktiv</th><th>Adresse</th></tr></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </section>
</main>
<script src="/assets/kundeliste/common.js"></script>
<script>
initUser();
const params = new URLSearchParams(location.search); const kundenr = params.get('kundenr') || ''; const id = params.get('id') || '';
let state = { kunde:null, adresser:[], produkter:[], selectedAdresseKey:'' };

async function load(){
 const r = await fetch('/api/kunde?' + new URLSearchParams({ kundenr, id }).toString()); const j = await r.json();
 if(!r.ok || j.error) return setStatus('error','Fejl: '+esc(j.error || r.status));
 state = { kunde:j.kunde, adresser:j.adresser||[], produkter:j.produkter||[], selectedAdresseKey:'' };
 setStatus('',''); document.getElementById('content').style.display='block'; render();
}
function setStatus(cls, html){ const el=document.getElementById('status'); el.className='status '+cls; el.innerHTML=html; el.style.display=html?'flex':'none'; }
function addressText(a){ return [a.adresse, [a.postnr,a.by].filter(Boolean).join(' ')].filter(Boolean).join(', '); }
function selectedProducts(){ return state.selectedAdresseKey ? state.produkter.filter(p=>p.adressekey===state.selectedAdresseKey) : state.produkter; }
function countByProduct(products){
  const map = new Map();
  for (const p of products) {
    const key = p.produkt || p.navn || 'Ukendt produkt';
    map.set(key, (map.get(key)||0)+1);
  }
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'da'));
}
function setAddress(key){ state.selectedAdresseKey = key || ''; render(); }

function render(){
 const k=state.kunde, adresser=state.adresser, produkter=state.produkter;
 const visibleProducts = selectedProducts();
 const activeVisible = visibleProducts.filter(p=>p.aktiv).length;
 document.getElementById('brandTitle').textContent = `${k.navn} (${k.kundenr})`; document.title = `Kunde – ${k.navn}`;
 document.getElementById('summary').innerHTML = `<div class="card"><div class="label">Kundenr.</div><div class="value">${esc(k.kundenr)}</div></div><div class="card"><div class="label">Adresser</div><div class="value">${adresser.length}</div></div><div class="card"><div class="label">Produkter</div><div class="value">${visibleProducts.filter(p=>p.aktiv).length}</div></div><div class="card"><div class="label">Område</div><div class="value">${esc(k.omraade)}</div></div>`;
 document.getElementById('kundeInfo').innerHTML = `<p><b>${esc(k.navn)}</b></p><p>Kundestatus: ${esc(k.kundestatus)}</p><p>Aktiv: ${k.aktiv?'Ja':'Nej'}</p><p>Sidst opdateret: ${fmtDateTime(k.sidstImporteret || k.modifiedon)}</p>`;
 document.getElementById('adresseInfo').innerHTML = renderAdresser(adresser);
 document.getElementById('produktTopCounts').textContent = `Aktive: ${activeVisible}`;
 document.getElementById('produktInfo').innerHTML = renderProduktCounts(visibleProducts.filter(p=>p.aktiv));
 renderProductTable(visibleProducts.filter(p=>p.aktiv), adresser);
}

function renderAdresser(adresser){
  if (!adresser.length) return '<p class="muted">Ingen adresser</p>';
  const buttons = adresser.length > 1 ? `<div class="addressChoice"><button class="btn ${state.selectedAdresseKey===''?'active':''}" onclick="setAddress('')">Alle adresser</button>${adresser.map(a=>`<button class="btn ${state.selectedAdresseKey===a.adressekey?'active':''}" onclick="setAddress('${escAttr(a.adressekey)}')">${esc(a.adresse)}</button>`).join('')}</div>` : '';
  const selected = state.selectedAdresseKey ? adresser.filter(a=>a.adressekey===state.selectedAdresseKey) : adresser;
  const list = selected.map(a=>`<p><b>${esc(a.adresse)}</b><br>${esc(a.postnr)} ${esc(a.by)}</p>`).join('');
  return buttons + list;
}

function renderProduktCounts(products){
  const counts = countByProduct(products);
  if (!counts.length) return '<p class="muted">Ingen produkter</p>';
  return `<table class="productCountTable">${counts.map(([name,count])=>`<tr><td>${esc(name)}</td><td>${count}</td></tr>`).join('')}</table>`;
}

function renderProductTable(products, adresser){
 const addrMap = Object.fromEntries(adresser.map(a=>[a.adressekey, addressText(a)]));
 document.getElementById('tbody').innerHTML = products.map(p=>`<tr><td>${esc(p.produkt)}</td><td>${esc(p.produktnr)}</td><td>${esc(p.serienr)}</td><td>${esc(p.kontrakt)}</td><td class="small">Inst: ${fmtDate(p.installationsdato)}<br>Garanti: ${fmtDate(p.garantistart)} - ${fmtDate(p.garantiudloeb)}</td><td>${p.aktiv?'<span class="badge ok">Aktiv</span>':'<span class="badge err">Inaktiv</span>'}</td><td>${esc(addrMap[p.adressekey] || p.adressekey)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Ingen produkter</td></tr>';
}
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
(function(){
  document.getElementById('btnInfo').href = '/kundeinfo.html?kundenr=' + encodeURIComponent(kundenr);
  const backBtn = document.getElementById('btnBack');
  if (document.referrer && document.referrer.indexOf('/kundeliste.html') !== -1) {
    backBtn.addEventListener('click', function(e){ e.preventDefault(); history.back(); });
  }
})();
load();
</script>
</body>
</html>
